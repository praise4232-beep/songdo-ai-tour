<style>
* {

}

body {

/* =========================

}

/* =========================
   CARD

.card {

}

}

.option-group {

}

.option {

}

.option.selected {

}

/* =========================
   BUTTON
========================= */

.button {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 17px;
    background: #005bac;
    color: white;
    font-size: 17px;

    cursor: pointer;
}

.button:hover {

}

/* =========================
   RESULT
========================= */

.result {
    display: none;
}

.ai-message {
    background: #eef7ff;
    border-left: 5px solid #005bac;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    line-height: 1.7;
}

/* =========================
   MAP
========================= */

.map-card {

    border-radius: 18px;

    border: 1px solid #e5e8eb;

}

.map-header {

}

}

.map-header span {

}

#map {

}

/* =========================
   ROUTE
========================= */

.route-card {

    padding: 25px;
    border: 1px solid #e5e8eb;
}

.route-item {
    display: flex;

}

.route-item:last-child {

}

.route-dot {

    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;

.route-content strong {

.route-line {

/* =========================

}

<script>

/* ==================================================
   ★★★ 카카오 JavaScript 키 ★★★

   아래 부분에 카카오 JavaScript 키를 입력하세요.

   예:
   const KAKAO_MAP_KEY = "실제키";

   ※ 위쪽 SDK 주소에도 같은 키를 입력해야 합니다.
================================================== */

const KAKAO_MAP_KEY = "YOUR_KAKAO_JAVASCRIPT_KEY";


/* ==================================================
   송도달빛축제공원역
================================================== */

const STATION = {

    name: "송도달빛축제공원역",

    lat: 37.4079,

    lng: 126.6253

};


/* ==================================================
   관광지
================================================== */

const PLACES = [

    {
        name: "송도달빛축제공원",
        lat: 37.4073,
        lng: 126.6225,
        icon: "🌳",
        time: 50
    },

    {
        name: "송도센트럴파크",
        lat: 37.3911,
        lng: 126.6398,
        icon: "🌊",
        time: 70
    },

    {
        name: "G타워 전망대",
        lat: 37.3947,
        lng: 126.6432,
        icon: "🏙️",
        time: 50
    },

    {
        name: "트라이보울",
        lat: 37.3938,
        lng: 126.6347,
        icon: "🎨",
        time: 50
    },

    {
        name: "인천도시역사관",
        lat: 37.3921,
        lng: 126.6402,
        icon: "🏛️",
        time: 60
    }

];


/* ==================================================
   선택값
================================================== */

let selected = {

    people: "👨 👩 👧 가족",

    activity: "🌳 산책",

    time: "1시간"

};


/* ==================================================
   옵션 선택
================================================== */

function selectOption(element, type) {

    const parent = element.parentElement;

    parent
        .querySelectorAll(".option")
        .forEach(button => {

            button.classList.remove("selected");

        });

    element.classList.add("selected");

    selected[type] = element.innerText;

}


/* ==================================================
   날씨
================================================== */

async function loadWeather() {

    try {

        const url =
            " https://api.open-meteo.com/v1/forecast"
            +
            "?latitude=37.4079"
            +
            "&longitude=126.6253"
            +
            "&current=temperature_2m,precipitation,weather_code"
            +
            "&timezone=Asia%2FSeoul";

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("날씨 API 응답 오류");
        }

        const data = await response.json();

        const current = data.current;

        let icon = "☀️";
        let text = "맑음";


        if (current.weather_code >= 51) {

            icon = "🌧️";
            text = "비";

        }

        else if (current.weather_code >= 45) {

            icon = "🌫️";
            text = "안개";

        }

        else if (current.weather_code >= 3) {

            icon = "☁️";
            text = "흐림";

        }


        document.getElementById(
            "weatherIcon"
        ).innerText = icon;


        document.getElementById(
            "temperature"
        ).innerText =
            Math.round(current.temperature_2m) + "℃";


        document.getElementById(
            "weatherText"
        ).innerText = text;


        document.getElementById(
            "weatherDetail"
        ).innerText =
            "송도달빛축제공원역 실시간 날씨";

    }

    catch(error) {

        console.log(
            "날씨 API 오류",
            error
        );

        document.getElementById(
            "weatherText"
        ).innerText =
            "날씨 정보를 불러오지 못했습니다.";

    }

}


/* ==================================================
   AI 추천
================================================== */

function recommend() {

    const result =
        document.getElementById("result");

    result.style.display = "block";


    const activity =
        selected.activity;

    const people =
        selected.people;

    const time =
        selected.time;


    let routePlaces;


    /* 사진 / 야경 */

    if (
        activity.includes("사진") ||
        activity.includes("야경")
    ) {

        routePlaces = [

            PLACES[0],
            PLACES[1],
            PLACES[2]

        ];

    }


    /* 문화 */

    else if (
        activity.includes("문화")
    ) {

        routePlaces = [

            PLACES[3],
            PLACES[4],
            PLACES[2]

        ];

    }


    /* 산책 */

    else {

        routePlaces = [

            PLACES[0],
            PLACES[1],
            PLACES[2]

        ];

    }


    /* ==================================================
       AI 설명
    ================================================== */

    document.getElementById(
        "aiMessage"
    ).innerHTML = `

        <strong>
            🤖 AI 추천 결과
        </strong>

        <br><br>

        현재 날씨와
        <strong>${people}</strong> 방문객의
        <strong>${activity}</strong> 선호도를 고려하여

        송도달빛축제공원역을 출발점으로 하는
        <strong>${time}</strong> 관광코스를 구성했습니다.

        <br><br>

        이동거리와 관광지 간 연계성을 고려하여
        효율적인 순서로 추천합니다.

    `;


    /* ==================================================
       경로 HTML
    ================================================== */

    let routeHTML = "";


    routeHTML += `

        <div class="route-item">

            <div class="route-dot">
                🚇
            </div>

            <div class="route-content">

                <strong>
                    송도달빛축제공원역
                </strong>

                <span>
                    AI 여행코스 출발
                </span>

            </div>

        </div>

    `;


    routePlaces.forEach(
        (place, index) => {

            routeHTML += `

                <div class="route-item">

                    <div class="route-dot">
                        ${place.icon}
                    </div>

                    <div class="route-content">

                        <strong>
                            ${index + 1}. ${place.name}
                        </strong>

                        <span>
                            송도 관광 추천지
                        </span>

                    </div>

                </div>

            `;

        }
    );


    routeHTML += `

        <div class="route-item">

            <div class="route-dot">
                🚇
            </div>

            <div class="route-content">

                <strong>
                    송도달빛축제공원역
                </strong>

                <span>
                    관광 후 역으로 이동
                </span>

            </div>

        </div>

    `;


    document.getElementById(
        "route"
    ).innerHTML = routeHTML;


    /* ==================================================
       지도
    ================================================== */

    createMap(routePlaces);


    result.scrollIntoView({
        behavior: "smooth"
    });

}


/* ==================================================
   지도 생성
================================================== */

function createMap(routePlaces) {

    if (
        typeof kakao === "undefined" ||
        !kakao.maps
    ) {

        document.getElementById(
            "map"
        ).innerHTML = `

            <div style="
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:30px;
                text-align:center;
                color:#667085;
                background:#f8fafc;
            ">

                <div>

                    <div style="
                        font-size:40px;
                        margin-bottom:15px;
                    ">
                        🗺️
                    </div>

                    <strong>
                        카카오 지도를 불러오지 못했습니다.
                    </strong>

                    <p>
                        카카오 JavaScript 키와<br>
                        Web 플랫폼 주소 설정을 확인해주세요.
                    </p>

                </div>

            </div>

        `;

        return;

    }


    kakao.maps.load(function() {

        const container =
            document.getElementById("map");


        const center =
            new kakao.maps.LatLng(
                STATION.lat,
                STATION.lng
            );


        const map =
            new kakao.maps.Map(
                container,
                {
                    center: center,
                    level: 6
                }
            );


        /* ==================================================
           전체 경로
        ================================================== */

        const route = [

            {
                name: STATION.name,
                lat: STATION.lat,
                lng: STATION.lng,
                icon: "🚇"
            },

            ...routePlaces,

            {
                name: STATION.name,
                lat: STATION.lat,
                lng: STATION.lng,
                icon: "🚇"
            }

        ];


        /* ==================================================
           마커
        ================================================== */

        route.forEach(
            function(place, index) {

                const position =
                    new kakao.maps.LatLng(
                        place.lat,
                        place.lng
                    );


                const marker =
                    new kakao.maps.Marker({

                        map: map,

                        position: position

                    });


                const info =
                    new kakao.maps.InfoWindow({

                        content: `

                            <div style="
                                padding:8px 12px;
                                font-size:13px;
                                white-space:nowrap;
                            ">

                                ${place.icon}
                                ${place.name}

                            </div>

                        `

                    });


                if (index === 0) {

                    info.open(
                        map,
                        marker
                    );

                }

            }
        );


        /* ==================================================
           지도 영역 자동 설정
        ================================================== */

        const bounds =
            new kakao.maps.LatLngBounds();


        route.forEach(
            place => {

                bounds.extend(

                    new kakao.maps.LatLng(
                        place.lat,
                        place.lng
                    )

                );

            }
        );


        map.setBounds(bounds);


        /* ==================================================
           추천 코스 선
        ================================================== */

        const linePath =
            route.map(

                place =>

                    new kakao.maps.LatLng(
                        place.lat,
                        place.lng
                    )

            );


        const polyline =
            new kakao.maps.Polyline({

                path: linePath,

                strokeWeight: 5,

                strokeColor: "#005bac",

                strokeOpacity: 0.8,

                strokeStyle: "solid"

            });


        polyline.setMap(map);


        /* ==================================================
           거리 계산
        ================================================== */

        let totalDistance = 0;


        for (
            let i = 0;
            i < route.length - 1;
            i++
        ) {

            totalDistance +=

                getDistance(

                    route[i].lat,
                    route[i].lng,

                    route[i + 1].lat,
                    route[i + 1].lng

                );

        }


        totalDistance =
            totalDistance.toFixed(1);


        /* 대략적인 도보 예상시간 */

        const estimatedTime =
            Math.round(
                totalDistance * 15
            );


        document.getElementById(
            "routeSummary"
        ).innerText =

            totalDistance
            + "km · 약 "
            + estimatedTime
            + "분";

    });

}


/* ==================================================
   좌표 거리 계산
================================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371;


    const dLat =
        (lat2 - lat1)
        * Math.PI / 180;


    const dLon =
        (lon2 - lon1)
        * Math.PI / 180;


    const a =

        Math.sin(dLat / 2)
        *
        Math.sin(dLat / 2)

        +

        Math.cos(
            lat1 * Math.PI / 180
        )

        *

        Math.cos(
            lat2 * Math.PI / 180
        )

        *

        Math.sin(dLon / 2)
        *
        Math.sin(dLon / 2);


    const c =

        2
        *
        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1 - a)

        );


    return R * c;

}
